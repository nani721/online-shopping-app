<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="Css/home.css" />
  </head>
  <body class="bg-secondary">
    <p
      id="alertMessage"
      class="bg-success text-white p-2 fs-4 position-fixed top-0 end-0"
    >
      Alert Message
    </p>
    <div class="container p-5 bg-light rounded my-3">
      <h1 class="display-4 fw-semibold text-center text-uppercase mb-5">
        Online Shopping
      </h1>
      <div class="product-section mb-5">
        <div class="d-flex justify-content-between align-items-center">
          <h2 class="h2 mb-3">Available Products</h2>
          <div class="d-flex my-3">
            <button class="btn btn-primary me-2" id="sortProductByPrice">
              Sort By Price
            </button>
            <button class="btn btn-primary me-2" id="sortProductByName">
              Sort By Name
            </button>
          </div>
        </div>

        <div class="products-container my-3" id="productContainer"></div>
      </div>
      <div class="cart-section">
        <h2 class="h2 mb-3">My Cart</h2>
        <div class="cart-container my-3" id="cartContainer"></div>
        <h3 class="h3 text-end" id="cartValue">Rs:</h3>
        <div class="d-flex my-3">
          <button class="btn btn-primary me-2" id="sortByPrice">
            Sort By Price
          </button>
          <button class="btn btn-primary me-2" id="sortByName">
            Sort By Name
          </button>
          <button class="btn btn-primary me-2" id="emptyCart">
            Clear Cart
          </button>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/home2.js"></script>
  </body>
</html>
